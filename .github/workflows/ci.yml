# Tests the library and checks that every port builds. Runs on pushes to
# master and on pull requests, and is called by the release workflow before it
# builds anything.
name: CI
# A pull request run is titled with the pull request's number and title. An
# empty name, as on a push, keeps GitHub's default title, the commit message.
run-name: >-
  ${{ github.event_name == 'pull_request'
  && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
  || '' }}

# Branch protection on master requires one check, "CI passed", which the last
# job reports. It passes when every other job passed or was skipped, so adding
# or renaming a job needs no change to the protection.
#
# A pull request that changes only version/VERSION skips the build jobs: the
# changes job finds nothing else changed. The workflow itself still runs on
# every pull request, because a required check that never starts blocks the
# merge, so pull_request must have no path filter.
#
# A push of version/VERSION alone does not run CI at all. The tag that follows a
# bump runs the full CI through the release workflow, before anything is built.
on:
  push:
    branches: [master]
    paths-ignore: [version/VERSION]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  WAILS_VERSION: v2.17.0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  # Decides whether the build jobs run: "true" unless this is a pull request
  # that changes only version/VERSION. A pull request is checked out as its
  # merge into the base branch, whose first parent is the base, so a diff
  # against that parent lists the pull request's changes. Pushes and release
  # runs always build.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: diff
        run: |
          build=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            echo "Changed files:"; echo "$changed"
            if [ "$changed" = version/VERSION ]; then
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  go:
    name: Go (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - name: Test
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...
      - name: Cross-compile the Android server
        if: runner.os == 'Linux'
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go build -o /dev/null ./cmd/ck-karaoke-server
          go build -o /dev/null ./cmd/ck-queue-manager

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The image the release builds the Linux package on; see release.yml.
          - os: ubuntu-24.04
            tags: desktop,production,webkit2_41
            # Room for an uncached WebKitGTK download from a slow mirror.
            timeout: 45
          - os: windows-latest
            tags: desktop,production
          - os: macos-latest
            tags: desktop,production
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout || 20 }}
    defaults:
      run:
        shell: bash
        working-directory: ports/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ports/desktop/go.mod
          cache-dependency-path: ports/desktop/go.sum
      # The runners' Ubuntu mirror can be slow enough that downloading these
      # takes ten minutes, so the downloaded .deb files are cached between runs.
      # apt still installs them normally, dependencies included; only the
      # download is skipped. Change the key to refresh the cache.
      - name: Restore WebKitGTK packages
        id: apt-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives
          key: apt-webkitgtk-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-archives/partial
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-archives" \
            libgtk-3-dev libwebkit2gtk-4.1-dev
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
      # Saved as soon as the download is done, not at the end of the job, so a
      # later failure does not throw the download away.
      - name: Save WebKitGTK packages
        if: runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives
          key: apt-webkitgtk-${{ runner.os }}-${{ runner.arch }}-v1
      - run: go vet -tags ${{ matrix.tags }} .
      # CK Queue Remote, the same module with the queue backend.
      - run: go vet -tags ${{ matrix.tags }},queue .
      - name: Install Wails
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION"
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
      # The same packaging the release runs, so a broken installer, bundle or
      # disk image shows up here rather than on a tag. Nothing is uploaded.
      - name: Package
        run: ./package.sh "$RUNNER_TEMP/dist"
      - name: Package CK Queue Remote
        if: runner.os != 'Linux'
        run: ./package.sh --queue "$RUNNER_TEMP/dist"

  # The queue manager's tray app: its own module, with fyne.io/systray and a
  # Wails configuration window. It needs cgo on macOS and Linux; Linux also
  # needs WebKitGTK, from the packages the desktop job caches.
  queue-desktop:
    name: Queue manager tray (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The image the release builds the Linux package on, and the one
          # whose packages the desktop job caches. On another Ubuntu release
          # the cached packages do not match and apt downloads them all again.
          - os: ubuntu-24.04
            timeout: 45
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout || 20 }}
    defaults:
      run:
        shell: bash
        working-directory: ports/queue-desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ports/queue-desktop/go.mod
          cache-dependency-path: ports/queue-desktop/go.sum
      - name: Restore WebKitGTK packages
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives
          key: apt-webkitgtk-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-archives/partial
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             -o Dir::Cache::Archives="$HOME/apt-archives"             libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Vet
        run: |
          tags=desktop,production
          [ "$RUNNER_OS" = Linux ] && tags=$tags,webkit2_41
          go vet -tags "$tags" ./...
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
      # The same packaging the release runs, unsigned, so a broken installer,
      # bundle or package shows up here rather than on a tag.
      - name: Package
        run: ./package.sh "$RUNNER_TEMP/dist"

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"
      - run: ./ports/android/build.sh

  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: brew install xcodegen
      - name: Build the Go server and generate the project
        run: XCODE="$(xcode-select -p | sed 's#/Contents/Developer##')" ./ports/ios/build.sh
      # arm64 only: the Go archive has no x86_64 simulator slice.
      - name: Build the apps for the simulator
        run: |
          for scheme in CKKaraoke CKQueueRemote; do
            xcodebuild -project ports/ios/CKKaraoke.xcodeproj -scheme "$scheme" \
              -sdk iphonesimulator -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
          done
      # The device build a release ships, so that packaging problems show up
      # before a tag.
      - name: Package the unsigned IPA
        run: |
          XCODE="$(xcode-select -p | sed 's#/Contents/Developer##')" \
            ./ports/ios/package.sh "$RUNNER_TEMP/dist"

  # The one check branch protection requires. always() makes it run even when a
  # job it needs failed or was skipped, and it then fails unless every job
  # passed or was skipped. Every job above must be listed in needs.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, go, desktop, queue-desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case $result in
              success|skipped) ;;
              *) echo "A job did not pass."; exit 1 ;;
            esac
          done
