# Builds the release binaries and publishes a GitHub release. Runs only when a
# version tag is pushed:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# A tag with a suffix (v1.2.3-rc1) is published as a pre-release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  WAILS_VERSION: v2.16.0

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      # The builds take their version from version/VERSION, so the tag has to
      # name the same one. Bump the file, commit, then tag.
      - id: v
        name: Parse the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-SUFFIX]"; exit 1
          fi
          source=$(tr -d '[:space:]' < version/VERSION)
          if [ "$version" != "$source" ]; then
            echo "tag $GITHUB_REF_NAME does not match version/VERSION ($source)"; exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( minor > 99 || patch > 99 )); then
            echo "minor and patch must be below 100 to fit the Android version code"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"
          if [ -n "${BASH_REMATCH[4]}" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android APK and bundle
    needs: [ci, version]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"
      # Without the four ANDROID_* secrets the APK is signed with a throwaway
      # debug key, and later releases will not install over it.
      - name: Decode the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a debug key"
          fi
      - name: Build
        env:
          CK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./ports/android/build.sh release
          ./ports/android/build.sh bundle
          mkdir -p dist
          cp ports/android/app/build/outputs/apk/release/app-release.apk \
            "dist/ck-karaoke-$VERSION-android.apk"
          cp ports/android/app/build/outputs/bundle/release/app-release.aab \
            "dist/ck-karaoke-$VERSION-android.aab"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: [ci, version]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: ports/desktop
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ports/desktop/go.mod
          cache-dependency-path: ports/desktop/go.sum
      - name: Install Wails and NSIS
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION"
          choco install nsis -y --no-progress
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
      - name: Package
        run: ./package.sh ../../dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS disk image
    needs: [ci, version]
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ports/desktop
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ports/desktop/go.mod
          cache-dependency-path: ports/desktop/go.sum
      - name: Install Wails
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION"
      # Signed with the Developer ID certificate in the MACOS_* secrets, imported
      # into a throwaway keychain, and notarized. A release must be both, so a
      # missing secret fails the job. See docs/BUILDING.md.
      - name: Import the signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ] || [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "::error::MACOS_CERTIFICATE_BASE64 and MACOS_CERTIFICATE_PASSWORD must be set"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(openssl rand -hex 16)
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "MACOS_SIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"
      - name: Package
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          for name in MACOS_NOTARY_APPLE_ID MACOS_NOTARY_PASSWORD MACOS_NOTARY_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name must be set"
              exit 1
            fi
          done
          ./package.sh ../../dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux package
    needs: [ci, version]
    # Pinned, not ubuntu-latest: the package requires the glibc it was built
    # against, and 24.04's keeps it installable on Ubuntu 22.04 and Debian 12.
    # Keep it the same as the Linux desktop job in ci.yml, which shares the
    # apt cache.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ports/desktop
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ports/desktop/go.mod
          cache-dependency-path: ports/desktop/go.sum
      # The packages CI downloaded and cached; see the desktop job in ci.yml.
      - name: Restore WebKitGTK packages
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives
          key: apt-webkitgtk-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Install WebKitGTK and Wails
        run: |
          mkdir -p ~/apt-archives/partial
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-archives" \
            libgtk-3-dev libwebkit2gtk-4.1-dev
          go install "github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION"
      - name: Package
        run: ./package.sh ../../dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS IPA (unsigned)
    needs: [ci, version]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: brew install xcodegen
      # Unsigned: the user signs it with their own Apple ID before installing.
      # See ports/ios/README.md.
      - name: Package
        run: |
          XCODE="$(xcode-select -p | sed 's#/Contents/Developer##')" \
            ./ports/ios/package.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, android, windows, macos, linux, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "CK Karaoke ${{ needs.version.outputs.version }}" --generate-notes --verify-tag)
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*
